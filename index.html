<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Archivos a Google Drive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .upload-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: bold;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            background-color: #fafafa;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357ae8;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .loading {
            color: #e67e22;
        }
        .success {
            color: #27ae60;
        }
        .error {
            color: #c0392b;
        }
    </style>
</head>
<body>

<div class="upload-card">
    <h2>Subir Archivo a Drive</h2>
    <form id="uploadForm">
        <div class="form-group">
            <label for="fileInput">Selecciona un archivo (PDF, Imagen, etc.):</label>
            <!-- accept=".pdf, image/*" permite archivos PDF y cualquier formato de imagen -->
            <input type="file" id="fileInput" accept=".pdf, image/*" required>
        </div>
        <button type="submit" id="submitBtn">Subir Archivo</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxcvcIkebOpLzv7yVlmhCr30unYk-hzOhICzUywqvOzJxqzNxlutfHC3EYcbeRGNlza/exec"; // Pega aquí tu URL

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        
        if (fileInput.files.length === 0) {
            alert("Por favor selecciona un archivo.");
            return;
        }
        
        const file = fileInput.files[0];
        statusDiv.className = "loading";
        statusDiv.innerText = "Subiendo archivo, por favor espera...";
        submitBtn.disabled = true;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
            // Extraer solo los datos Base64 (removiendo el encabezado data:...;base64,)
            const base64Data = reader.result.split(',')[1];
            
            const payload = {
                fileName: file.name,
                mimeType: file.type,
                fileData: base64Data
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Requerido para llamadas externas a Apps Script
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusDiv.className = "success";
                statusDiv.innerText = "¡Archivo subido con éxito a Google Drive!";
                document.getElementById('uploadForm').reset();
            })
            .catch(error => {
                console.error("Error:", error);
                statusDiv.className = "error";
                statusDiv.innerText = "Hubo un error al subir el archivo.";
            })
            .finally(() => {
                submitBtn.disabled = false;
            });
        };
        
        reader.onerror = function (error) {
            console.error("Error leyendo el archivo:", error);
            statusDiv.className = "error";
            statusDiv.innerText = "No se pudo leer el archivo.";
            submitBtn.disabled = false;
        };
    });
</script>

</body>
</html>
